name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-configuration-cache assembleDebug
        env:
          DRIME_CLIENT_ID: ${{ vars.DRIME_CLIENT_ID }}

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk tape-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tape-debug-apk
          path: tape-debug.apk

      # A rolling "Latest build" release: open it on your phone and tap the APK to install.
      - name: Publish latest build
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build tape-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Debug build of ${GITHUB_SHA::7}. Install on Android by opening tape-debug.apk."
