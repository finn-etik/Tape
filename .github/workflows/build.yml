name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-configuration-cache assembleDebug
        env:
          DRIME_CLIENT_ID: ${{ vars.DRIME_CLIENT_ID }}

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk tape-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tape-debug-apk
          path: tape-debug.apk

      # A rolling "Latest build" release: open it on your phone and tap the APK to install.
      - name: Publish latest build
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          git tag -f latest-build "$GITHUB_SHA"
          git push -f origin latest-build
          notes="Debug build of ${GITHUB_SHA::7}. Install on Android by opening tape-debug.apk."
          # GitHub sometimes answers 5xx here even though the release was created,
          # so check for it rather than trusting the status code.
          for attempt in 1 2 3; do
            gh release view latest-build >/dev/null 2>&1 && break
            gh release create latest-build --verify-tag --prerelease --title "Latest build" --notes "$notes" || true
            sleep $((attempt * 5))
          done
          gh release upload latest-build tape-debug.apk --clobber
